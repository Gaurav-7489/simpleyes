name: Owner launch readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check owner inputs and live enquiry activation
        run: node scripts/check-launch.mjs --live
